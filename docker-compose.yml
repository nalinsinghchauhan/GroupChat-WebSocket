services:
  mongo:
    image: mongo:7
    container_name: chatroom-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    container_name: chatroom-server
    restart: unless-stopped
    ports:
      - "5050:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/chatroom
      JWT_SECRET: ${JWT_SECRET:-replace_with_a_long_random_string}
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongo

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5050/api
        VITE_SOCKET_URL: http://localhost:5050
    container_name: chatroom-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mongo-data:
